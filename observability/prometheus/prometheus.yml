global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # CineBot yerelde 5001 portunda calisir. METRICS_BEARER_TOKEN acilirsa
  # bu job'a authorization.credentials veya credentials_file eklenmelidir.
  - job_name: cinebot-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:5001"]
        labels:
          environment: local

